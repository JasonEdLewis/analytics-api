upstream api_backend {
    # Round-robin load balancing across all API containers
    # Service name resolves via Docker DNS to container IP
    server analytics_api-api-1:8000;
    server analytics_api-api-2:8000;
    server analytics_api-api-3:8000;
}

server {
    listen 8000;
    server_name localhost;

    # Main API endpoint - proxy to backend
    location / {
        proxy_pass http://api_backend;
        
        # Preserve client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint for nginx itself
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}