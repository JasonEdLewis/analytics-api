resolver 127.0.0.11 ipv6=off valid=5s;   # Docker’s embedded DNS; refresh every ~5s
resolver_timeout 2s;

upstream api_backend {
  zone api_backend 64k;
  least_conn;
  server api:8000 resolve;               # service name; DNS returns all replicas
  keepalive 64;

  # Faster failover if a pod dies while cached
  # (applies when connecting to a now-dead IP)
}

server {
  listen 8000;
  server_name _;

  location /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "healthy\n";              # or proxy_pass http://api_backend/health;
  }

  location / {
    proxy_pass http://api_backend;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Retry on common upstream failures
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
  }
}
